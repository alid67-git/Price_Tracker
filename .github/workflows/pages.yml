name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Pages yapilandirmasi
        uses: actions/configure-pages@v5

      - name: dashboard/ klasorunu Pages artifact olarak yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: GitHub Pages'e deploy et
        id: deployment
        uses: actions/deploy-pages@v4
